<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hazri Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500..800&family=Geist:wght@400..700&family=Noto+Sans+Devanagari:wght@600&display=swap">
<style>
/* Layout: left rail on desktop, floating tab bar on phones. The one bold element is the punch dial on the Today screen; everything else stays quiet. */
:root {
  --bg: #EDF0F6;
  --surface: #FFFFFF;
  --surface-2: #F4F6FB;
  --ink: #0E1628;
  --ink-2: #55627A;
  --line: #DCE2EE;
  --accent: #2340F5;
  --accent-ink: #FFFFFF;
  --accent-soft: #E2E7FF;
  --good: #0B8F4D;
  --warn: #A86B00;
  --half: #D05A14;
  --bad: #D4303C;
  --info: #0A78B5;
  --holi: #7142E0;
  --off: #7A869C;
  --shadow: 0 1px 2px rgba(14,22,40,.06), 0 10px 28px rgba(14,22,40,.06);
  --font-display: 'Bricolage Grotesque', 'Geist', system-ui, sans-serif;
  --font-body: 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-hindi: 'Noto Sans Devanagari', 'Nirmala UI', sans-serif;
  --r-lg: 22px;
  --r-md: 14px;
  --r-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #080C18; --surface: #101627; --surface-2: #161E33; --ink: #EAF0FF; --ink-2: #94A2BF;
    --line: #232D47; --accent: #8097FF; --accent-ink: #0A1030; --accent-soft: #1C2654;
    --good: #3ECF87; --warn: #F2B73D; --half: #FF8F4D; --bad: #FF6B76; --info: #4DB6F5; --holi: #AB8DFF; --off: #7482A0;
    --shadow: 0 1px 2px rgba(0,0,0,.45), 0 12px 32px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #080C18; --surface: #101627; --surface-2: #161E33; --ink: #EAF0FF; --ink-2: #94A2BF;
  --line: #232D47; --accent: #8097FF; --accent-ink: #0A1030; --accent-soft: #1C2654;
  --good: #3ECF87; --warn: #F2B73D; --half: #FF8F4D; --bad: #FF6B76; --info: #4DB6F5; --holi: #AB8DFF; --off: #7482A0;
  --shadow: 0 1px 2px rgba(0,0,0,.45), 0 12px 32px rgba(0,0,0,.4);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.tone-good { --tone: var(--good); } .tone-warn { --tone: var(--warn); } .tone-half { --tone: var(--half); }
.tone-bad { --tone: var(--bad); } .tone-info { --tone: var(--info); } .tone-holi { --tone: var(--holi); }
.tone-off { --tone: var(--off); } .tone-accent { --tone: var(--accent); }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100dvh; }
.rail { position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column; gap: 22px; padding: 22px 16px; background: var(--surface); border-right: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; font: 700 22px/1 var(--font-display); letter-spacing: -.02em; }
.brand svg { width: 32px; height: 32px; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav button { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border: 0; border-radius: var(--r-md); background: transparent; color: var(--ink-2); font-weight: 560; text-align: left; }
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.who b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who small { color: var(--ink-2); }
.who > div { min-width: 0; }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 700 15px/1 var(--font-display); flex: none; }
.avatar.lg { width: 84px; height: 84px; font-size: 32px; }
.main { padding: 30px clamp(16px, 3.2vw, 44px) 56px; max-width: 1200px; width: 100%; min-width: 0; }
.topbar, .tabbar { display: none; }
.demo-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 22px; padding: 10px 14px; border-radius: var(--r-md); background: var(--accent-soft); color: var(--ink); font-size: 14px; }
.demo-bar button { margin-left: auto; }

.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; margin-bottom: 24px; }
.page-head h1 { font: 700 clamp(28px, 4vw, 38px)/1.1 var(--font-display); letter-spacing: -.03em; text-wrap: balance; }
.page-head p { color: var(--ink-2); margin-top: 6px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.grid-2.dash { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
h2.sec { font: 650 17px/1.3 var(--font-display); letter-spacing: -.01em; }

/* ---------- surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; }
.tile { padding: 14px 16px; border-radius: var(--r-md); background: color-mix(in srgb, var(--tone, var(--accent)) 11%, var(--surface)); min-width: 0; }
.tile b { display: block; font: 700 26px/1.1 var(--font-display); letter-spacing: -.02em; color: var(--tone, var(--accent)); font-variant-numeric: tabular-nums; }
.tile span { color: var(--ink-2); font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 11px; border-radius: 99px; font-size: 13px; font-weight: 600; color: var(--tone, var(--ink-2)); background: color-mix(in srgb, var(--tone, var(--ink-2)) 14%, transparent); white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--tone); flex: none; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 18px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; transition: transform .12s, background .15s; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.danger.solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { min-height: 34px; padding: 0 14px; font-size: 14px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { display: grid; place-items: center; width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); }
.icon-btn:hover { background: var(--surface-2); }
.seg { display: inline-flex; padding: 4px; gap: 2px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 14px; border: 0; border-radius: 99px; background: transparent; color: var(--ink-2); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg.icons button { padding: 0 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { min-height: 34px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-weight: 560; font-size: 14px; }
.pick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.field input, .field select, .field textarea { width: 100%; min-height: 44px; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
.field textarea { min-height: 96px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.fields .wide { grid-column: 1 / -1; }
.err { color: var(--bad); font-size: 14px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.switcher { display: inline-flex; align-items: center; gap: 4px; }
.switcher strong { min-width: 150px; text-align: center; font: 650 16px/1 var(--font-display); }
.switcher .icon-btn { border: 0; background: transparent; }
.search { position: relative; }
.search .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-2); }
.search input { padding-left: 42px; }

/* ---------- punch dial ---------- */
.dial { display: grid; justify-items: center; gap: 18px; }
.bigclock { font: 700 clamp(46px, 8vw, 68px)/1 var(--font-display); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.bigclock .sec, .bigclock .ap { font-size: .38em; letter-spacing: 0; color: var(--ink-2); margin-left: 4px; }
.bigclock .colon { animation: blink 2s steps(1) infinite; }
@keyframes blink { 50% { opacity: .25; } }
.ring { position: relative; width: min(280px, 72vw); aspect-ratio: 1; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: var(--accent-soft); }
.ring .bar { stroke: var(--accent); transition: stroke-dashoffset 1.1s cubic-bezier(.2,.7,.2,1), stroke .3s; }
.ring.done .bar { stroke: var(--good); }
.ring-mid { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 6px; text-align: center; }
.ring-mid b { font: 700 38px/1 var(--font-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.times { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.punch { min-height: 60px; font-size: 18px; width: 100%; }

/* ---------- calendar / lists ---------- */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal .dow { text-align: center; font-size: 12px; font-weight: 600; color: var(--ink-2); padding-bottom: 4px; }
.cal .day { aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; font-size: 14px; font-variant-numeric: tabular-nums; max-width: 52px; width: 100%; justify-self: center; }
.cal .day.f { background: color-mix(in srgb, var(--tone) 17%, transparent); color: var(--tone); font-weight: 700; }
.cal .day.today { outline: 2px solid var(--accent); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 14px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.rows { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 14px; padding: 14px 4px; border-bottom: 1px solid var(--line); min-width: 0; }
.item:last-child { border-bottom: 0; }
button.item { width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; border-radius: var(--r-sm); padding-inline: 8px; }
button.item:hover { background: var(--surface-2); }
.item .grow { flex: 1; min-width: 0; }
.item .grow b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .grow small { color: var(--ink-2); }
.date-badge { width: 52px; text-align: center; flex: none; }
.date-badge b { display: block; font: 700 22px/1 var(--font-display); }
.date-badge small { color: var(--ink-2); font-size: 12px; }
.bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .6s; }
.rate { font: 700 clamp(40px, 6vw, 56px)/1 var(--font-display); letter-spacing: -.04em; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 12px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-size: 13px; font-weight: 600; color: var(--ink-2); }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
.empty { padding: 34px 12px; text-align: center; color: var(--ink-2); }
.empty b { display: block; color: var(--ink); font: 650 17px/1.3 var(--font-display); margin-bottom: 4px; }

/* ---------- login ---------- */
.login { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); min-height: 100dvh; }
.login-hero { background: var(--accent); color: var(--accent-ink); padding: clamp(24px, 5vw, 64px); display: flex; flex-direction: column; justify-content: space-between; gap: 40px; }
.login-hero .brand { color: inherit; padding: 0; }
.login-hero .bigclock .sec, .login-hero .bigclock .ap { color: inherit; opacity: .7; }
.login-hero .hindi { font: 600 22px/1.4 var(--font-hindi); opacity: .85; }
.login-hero ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; font-size: 16px; }
.login-hero li { display: flex; align-items: center; gap: 10px; }
.login-hero .bigclock { font-size: clamp(56px, 9vw, 104px); }
.login-form { display: grid; align-content: center; justify-items: center; padding: clamp(24px, 5vw, 64px); position: relative; }
.login-form > .seg.icons { position: absolute; top: 20px; right: 20px; }
.login-box { width: min(400px, 100%); display: grid; gap: 18px; }
.login-box h2 { font: 700 30px/1.15 var(--font-display); letter-spacing: -.03em; }
.demo-box { padding: 14px; border-radius: var(--r-md); background: var(--surface-2); display: grid; gap: 10px; }

/* ---------- modal + toast ---------- */
.scrim { position: fixed; inset: 0; background: rgba(8,12,24,.5); z-index: 40; }
.sheet { position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: 0 24px 80px rgba(0,0,0,.35); animation: pop .18s ease-out; }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -48%) scale(.98); } }
.sheet header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 6px; }
.sheet h2 { font: 700 20px/1.2 var(--font-display); letter-spacing: -.02em; }
.sheet-body { padding: 12px 20px 8px; overflow-y: auto; display: grid; gap: 14px; }
.sheet footer { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; padding: 14px 20px 18px; }
.sheet textarea.code { min-height: 220px; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }
.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100vw - 32px); padding: 12px 20px; border-radius: 99px; background: var(--ink); color: var(--bg); font-weight: 560; box-shadow: var(--shadow); }

/* ---------- phones ---------- */
@media (max-width: 899px) {
  .shell { display: block; }
  .rail { display: none; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 0; }
  .topbar .row { gap: 8px; }
  .main { padding-top: 20px; padding-bottom: 120px; }
  .tabbar { display: flex; position: fixed; z-index: 30; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding: 6px; gap: 2px; border-radius: 28px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .tabbar button { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px; border: 0; border-radius: 22px; background: transparent; color: var(--ink-2); font-size: 11px; font-weight: 600; }
  .tabbar button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
  .grid-2, .grid-2.dash { grid-template-columns: minmax(0, 1fr); }
  .login { grid-template-columns: minmax(0, 1fr); }
  .login-hero { gap: 22px; padding-bottom: 32px; }
  .login-hero ul { display: none; }
  .login-form > .seg.icons { position: static; justify-self: end; margin-bottom: 18px; }
  .toast { bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
}
@media (max-width: 520px) {
  .fields { grid-template-columns: minmax(0, 1fr); }
  .card { padding: 16px; }
  .switcher strong { min-width: 120px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<div id="app"></div>
<div id="modal" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
'use strict';

/* ================= helpers ================= */
var KEY = 'hazri.web.v1', SKEY = 'hazri.web.session';
var DAY = 864e5;
function $(s, e) { return (e || document).querySelector(s); }
var ls = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
};
function pad(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function pd(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
var D3 = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function ic(n) { return '<svg class="ic" aria-hidden="true"><use href="#i-' + n + '"/></svg>'; }
function fmtTime(ms) { return ms ? new Date(ms).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true }).toUpperCase() : '--:--'; }
function rng(r) { return fmtTime(r.in) + (r.out ? ' to ' + fmtTime(r.out) : ' \u00b7 still working'); }
function fmtDur(ms) { var m = Math.max(0, Math.floor(ms / 60000)); return Math.floor(m / 60) + 'h ' + pad(m % 60) + 'm'; }
function fmtDate(ds, long) { var d = pd(ds); return D3[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 3) + (long ? ' ' + d.getFullYear() : ''); }
function at(d, hm) { var p = hm.split(':').map(Number); return new Date(d.getFullYear(), d.getMonth(), d.getDate(), p[0], p[1]).getTime(); }
function hue(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
function avatar(name, cls) { return '<span class="avatar ' + (cls || '') + '" style="background:hsl(' + hue(name) + ' 52% 38%)">' + esc(name.trim().charAt(0).toUpperCase()) + '</span>'; }

/* ================= data ================= */
function defaults() {
  return { employees: [], att: [], leaves: [], holidays: [], nextId: 1, demo: false,
    settings: { company: 'Your Company', start: '09:30', end: '18:00', grace: 15, halfHrs: 4, off: [0], theme: 'system', adminPin: '0000' } };
}
function seedDemo(d) {
  d.demo = true;
  d.settings.company = 'Northwind Studio';
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var people = [
    ['EMP001', 'Aarav Mehta', 'Sales', 'Account Executive', '9820011101'],
    ['EMP002', 'Priya Nair', 'Design', 'Product Designer', '9820011102'],
    ['EMP003', 'Rohan Gupta', 'Engineering', 'Software Engineer', '9820011103'],
    ['EMP004', 'Sneha Kulkarni', 'People', 'HR Manager', '9820011104'],
    ['EMP005', 'Imran Sheikh', 'Accounts', 'Accountant', '9820011105'],
    ['EMP006', 'Kavya Reddy', 'Support', 'Support Lead', '9820011106']
  ];
  people.forEach(function (p) {
    d.employees.push({ id: d.nextId++, code: p[0], name: p[1], dept: p[2], role: p[3], phone: p[4], pin: '1234', active: true, join: ymd(addDays(today, -90)) });
  });
  d.holidays.push({ id: d.nextId++, date: ymd(addDays(today, -9)), name: 'Gandhi Jayanti' });
  d.holidays.push({ id: d.nextId++, date: '2026-10-20', name: 'Dussehra' });
  d.holidays.push({ id: d.nextId++, date: '2026-11-08', name: 'Diwali' });
  var hol = {}; d.holidays.forEach(function (h) { hol[h.date] = 1; });
  d.leaves.push({ id: d.nextId++, emp: 3, type: 'Sick', from: ymd(addDays(today, -12)), to: ymd(addDays(today, -10)), reason: 'Fever and rest as advised by the doctor.', status: 'APPROVED', at: Date.now() - 13 * DAY });
  d.leaves.push({ id: d.nextId++, emp: 2, type: 'Casual', from: ymd(addDays(today, 5)), to: ymd(addDays(today, 6)), reason: 'Family function out of town.', status: 'PENDING', at: Date.now() - DAY });
  d.leaves.push({ id: d.nextId++, emp: 6, type: 'Paid', from: ymd(addDays(today, 9)), to: ymd(addDays(today, 9)), reason: 'Bank and passport appointment.', status: 'PENDING', at: Date.now() - 2 * DAY });
  var seed = 7;
  function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  for (var i = 45; i >= 1; i--) {
    var day = addDays(today, -i), ds = ymd(day);
    if (d.settings.off.indexOf(day.getDay()) >= 0 || hol[ds]) continue;
    d.employees.forEach(function (e) {
      if (e.id === 3 && ds >= d.leaves[0].from && ds <= d.leaves[0].to) return;
      var r = rnd(), inM, outM, st;
      if (r < 0.07) return;
      if (r < 0.2) { st = 'LATE'; inM = 9 * 60 + 50 + Math.floor(rnd() * 50); outM = 18 * 60 + Math.floor(rnd() * 40); }
      else if (r < 0.25) { st = 'HALF_DAY'; inM = 9 * 60 + 20 + Math.floor(rnd() * 20); outM = 13 * 60 + 15 + Math.floor(rnd() * 30); }
      else { st = 'PRESENT'; inM = 9 * 60 + Math.floor(rnd() * 40); outM = 18 * 60 + Math.floor(rnd() * 60); }
      d.att.push({ id: d.nextId++, emp: e.id, date: ds, in: at(day, pad(Math.floor(inM / 60)) + ':' + pad(inM % 60)), out: at(day, pad(Math.floor(outM / 60)) + ':' + pad(outM % 60)), status: st, note: '' });
    });
  }
  var now = new Date(), tds = ymd(now);
  if (d.settings.off.indexOf(now.getDay()) < 0) {
    [[2, '09:04'], [3, '09:18'], [4, '09:52'], [5, '09:26']].forEach(function (x) {
      var t = at(now, x[1]);
      if (t < now.getTime()) {
        var late = t > at(now, d.settings.start) + d.settings.grace * 60000;
        d.att.push({ id: d.nextId++, emp: x[0], date: tds, in: t, out: null, status: late ? 'LATE' : 'PRESENT', note: '' });
      }
    });
  }
  return d;
}
function load() {
  var raw = ls.get(KEY);
  if (raw) {
    try {
      var d = JSON.parse(raw), base = defaults();
      d = Object.assign(base, d); d.settings = Object.assign(defaults().settings, d.settings || {});
      return d;
    } catch (e) {}
  }
  return seedDemo(defaults());
}
var db = load();
var attIndex = null, holSet = null;
function save() { attIndex = null; holSet = null; ls.set(KEY, JSON.stringify(db)); }
function nid() { return db.nextId++; }
function idx() { if (!attIndex) { attIndex = new Map(); db.att.forEach(function (a) { attIndex.set(a.emp + '|' + a.date, a); }); } return attIndex; }
function hols() { if (!holSet) { holSet = new Set(db.holidays.map(function (h) { return h.date; })); } return holSet; }
function empById(id) { return db.employees.find(function (e) { return e.id === id; }); }
function activeEmps() { return db.employees.filter(function (e) { return e.active; }); }

/* ================= attendance logic ================= */
var ST = {
  PRESENT: { l: 'Present', c: 'good' }, LATE: { l: 'Late', c: 'warn' }, HALF_DAY: { l: 'Half day', c: 'half' },
  ABSENT: { l: 'Absent', c: 'bad' }, LEAVE: { l: 'On leave', c: 'info' }, HOLIDAY: { l: 'Holiday', c: 'holi' },
  WEEKOFF: { l: 'Week off', c: 'off' }, PENDING: { l: 'Not in yet', c: 'off' }, FUTURE: { l: 'Upcoming', c: 'off' }, NA: { l: '-', c: 'off' }
};
function statusOf(e, ds) {
  var r = idx().get(e.id + '|' + ds);
  if (r) return r.status;
  if (ds < e.join) return 'NA';
  if (hols().has(ds)) return 'HOLIDAY';
  if (db.settings.off.indexOf(pd(ds).getDay()) >= 0) return 'WEEKOFF';
  if (db.leaves.some(function (l) { return l.emp === e.id && l.status === 'APPROVED' && ds >= l.from && ds <= l.to; })) return 'LEAVE';
  var t = ymd(new Date());
  return ds > t ? 'FUTURE' : ds === t ? 'PENDING' : 'ABSENT';
}
function chip(st) { var s = ST[st] || ST.NA; return '<span class="chip tone-' + s.c + '">' + s.l + '</span>'; }
function summary(e, ym) {
  var p = ym.split('-').map(Number), n = new Date(p[0], p[1], 0).getDate();
  var s = { P: 0, L: 0, H: 0, A: 0, V: 0, ms: 0 };
  for (var i = 1; i <= n; i++) {
    var ds = ym + '-' + pad(i), st = statusOf(e, ds);
    if (st === 'PRESENT') s.P++; else if (st === 'LATE') s.L++; else if (st === 'HALF_DAY') s.H++; else if (st === 'ABSENT') s.A++; else if (st === 'LEAVE') s.V++;
    var r = idx().get(e.id + '|' + ds);
    if (r && r.in && r.out) s.ms += Math.max(0, r.out - r.in);
  }
  s.att = s.P + s.L + s.H;
  return s;
}
function nextHoliday() {
  var t = ymd(new Date());
  return db.holidays.filter(function (h) { return h.date >= t; }).sort(function (a, b) { return a.date < b.date ? -1 : 1; })[0];
}
function csvFor(ym) {
  var p = ym.split('-').map(Number), n = new Date(p[0], p[1], 0).getDate();
  function q(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }
  var short = { PRESENT: 'P', LATE: 'L', HALF_DAY: 'H', ABSENT: 'A', LEAVE: 'LV', HOLIDAY: 'HOL', WEEKOFF: 'WO' };
  var out = 'Emp ID,Name,Department,Present,Late,Half Day,Absent,Leave,Worked Hours';
  for (var i = 1; i <= n; i++) out += ',' + i;
  out += '\n';
  activeEmps().forEach(function (e) {
    var s = summary(e, ym);
    out += [q(e.code), q(e.name), q(e.dept), s.P, s.L, s.H, s.A, s.V, (s.ms / 36e5).toFixed(1)].join(',');
    for (var j = 1; j <= n; j++) out += ',' + (short[statusOf(e, ym + '-' + pad(j))] || '');
    out += '\n';
  });
  return out;
}

/* ================= ui state ================= */
var session = null;
try { session = JSON.parse(ls.get(SKEY) || 'null'); } catch (e) { session = null; }
var nowD = new Date();
var ui = { tab: 'today', month: ymd(nowD).slice(0, 7), day: ymd(nowD), loginRole: 'emp', leaveFilter: 'PENDING', dashFilter: 'ALL', staffQ: '' };
(function () {
  var d = new Date(); d.setHours(0, 0, 0, 0);
  for (var i = 0; i < 7; i++) { if (db.settings.off.indexOf(d.getDay()) < 0 && !hols().has(ymd(d))) break; d = addDays(d, -1); }
  ui.day = ymd(d);
})();
var draft = null, lastFocus = null, toastT = null;
function me() { return session && session.role === 'emp' ? empById(session.id) : null; }
if (session && session.role === 'emp' && (!me() || !me().active)) session = null;
if (session && session.role === 'admin') ui.tab = 'dash';
function setSession(s) { session = s; if (s) ls.set(SKEY, JSON.stringify(s)); else ls.del(SKEY); }
function applyTheme() {
  var t = db.settings.theme, r = document.documentElement;
  if (t === 'light' || t === 'dark') r.setAttribute('data-theme', t); else r.removeAttribute('data-theme');
}
function toast(msg) {
  var t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 3200);
}

/* ================= views ================= */
function themeSeg() {
  var cur = db.settings.theme;
  return '<div class="seg icons" role="group" aria-label="Theme">' +
    [['system', 'auto', 'Match device'], ['light', 'sun', 'Light'], ['dark', 'moon', 'Dark']].map(function (x) {
      return '<button data-act="theme" data-v="' + x[0] + '" aria-pressed="' + (cur === x[0]) + '" aria-label="' + x[2] + '" title="' + x[2] + '">' + ic(x[1]) + '</button>';
    }).join('') + '</div>';
}
function logoSvg() {
  return '<svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="10" fill="var(--accent)"/><path d="m9 16.5 4.5 4.5L23 11.5" fill="none" stroke="var(--accent-ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function clockHtml() {
  return '<div class="bigclock" aria-label="Current time"><span id="c-h">--</span><span class="colon">:</span><span id="c-m">--</span><span class="sec" id="c-s">:--</span><span class="ap" id="c-a"></span></div>';
}
function viewLogin() {
  var emp = ui.loginRole === 'emp';
  return '<div class="login">' +
    '<section class="login-hero">' +
      '<div class="brand">' + logoSvg() + '<span>Hazri</span></div>' +
      '<div><p class="hindi" lang="hi">हाज़िरी</p>' + clockHtml() + '<p style="margin-top:10px;opacity:.85" id="c-date"></p></div>' +
      '<ul><li>' + ic('check') + 'Check in and out with one tap</li><li>' + ic('check') + 'Ask for leave and see the answer</li><li>' + ic('check') + 'Monthly reports that open in Excel</li></ul>' +
    '</section>' +
    '<section class="login-form">' + themeSeg() +
      '<form class="login-box" id="loginForm" autocomplete="off">' +
        '<div><h2>Log in to Hazri</h2><p class="muted" style="margin-top:6px">Mark your day, check your month.</p></div>' +
        '<div class="seg" role="group" aria-label="Log in as"><button type="button" data-act="role" data-v="emp" aria-pressed="' + emp + '">Employee</button><button type="button" data-act="role" data-v="admin" aria-pressed="' + !emp + '">Admin</button></div>' +
        (emp ? '<label class="field"><span>Employee ID</span><input id="lcode" placeholder="For example EMP001" autocapitalize="characters" required></label>' : '') +
        '<label class="field"><span>' + (emp ? 'PIN' : 'Admin PIN') + '</span><input id="lpin" type="password" inputmode="numeric" placeholder="4 to 8 digits" required></label>' +
        '<p class="err" id="lerr" role="alert" hidden></p>' +
        '<button class="btn primary block" type="submit">Log in</button>' +
        (db.demo ? '<div class="demo-box"><p class="small muted">Exploring? These accounts hold sample data.</p><div class="row"><button type="button" class="btn sm" data-act="demoEmp">Employee: Aarav</button><button type="button" class="btn sm" data-act="demoAdmin">Admin</button></div></div>' : '') +
        (!emp && db.settings.adminPin === '0000' ? '<p class="small muted">The first admin PIN is 0000. Change it in Settings.</p>' : '') +
      '</form>' +
    '</section></div>';
}

function tabsFor() {
  return session.role === 'admin'
    ? [['dash', 'Overview', 'home'], ['staff', 'Staff', 'users'], ['leaves', 'Leaves', 'case'], ['reports', 'Reports', 'chart'], ['settings', 'Settings', 'sliders']]
    : [['today', 'Today', 'home'], ['history', 'History', 'calendar'], ['leaves', 'Leaves', 'case'], ['profile', 'Profile', 'user']];
}
function viewShell() {
  var tabs = tabsFor(), e = me(), name = session.role === 'admin' ? 'Admin' : e.name;
  var sub = session.role === 'admin' ? db.settings.company : e.code;
  var nav = tabs.map(function (t) { return '<button data-act="nav" data-v="' + t[0] + '"' + (ui.tab === t[0] ? ' aria-current="page"' : '') + '>' + ic(t[2]) + '<span>' + t[1] + '</span></button>'; }).join('');
  var body = session.role === 'admin' ? adminView() : empView();
  return '<div class="shell">' +
    '<aside class="rail"><div class="brand">' + logoSvg() + '<span>Hazri</span></div><nav class="nav" aria-label="Main">' + nav + '</nav>' +
      '<div class="rail-foot">' + themeSeg() + '<div class="who">' + avatar(name) + '<div><b>' + esc(name) + '</b><small>' + esc(sub) + '</small></div></div>' +
      '<button class="btn block" data-act="logout">' + ic('logout') + 'Log out</button></div></aside>' +
    '<div><div class="topbar"><div class="brand">' + logoSvg() + '<span>Hazri</span></div><div class="row">' + themeSeg() + '<button class="icon-btn" data-act="logout" aria-label="Log out">' + ic('logout') + '</button></div></div>' +
    '<main class="main">' + (db.demo && session.role === 'admin' ? '<div class="demo-bar"><span>You are looking at sample data.</span><button class="btn sm" data-act="freshAsk">Remove sample data</button></div>' : '') + body + '</main></div>' +
    '<nav class="tabbar" aria-label="Main">' + nav + '</nav></div>';
}
function empView() {
  var e = me();
  return { today: viewToday, history: viewHistory, leaves: viewMyLeaves, profile: viewProfile }[ui.tab](e);
}
function adminView() {
  return { dash: viewDash, staff: viewStaff, leaves: viewAdminLeaves, reports: viewReports, settings: viewSettings }[ui.tab]();
}
function head(title, sub, right) {
  return '<div class="page-head"><div><h1>' + title + '</h1>' + (sub ? '<p>' + sub + '</p>' : '') + '</div>' + (right || '') + '</div>';
}
function monthSwitch() {
  var p = ui.month.split('-').map(Number);
  return '<div class="switcher"><button class="icon-btn" data-act="mPrev" aria-label="Previous month">' + ic('left') + '</button><strong>' + MONTHS[p[1] - 1] + ' ' + p[0] + '</strong><button class="icon-btn" data-act="mNext" aria-label="Next month">' + ic('right') + '</button></div>';
}
function daySwitch() {
  var isToday = ui.day === ymd(new Date());
  return '<div class="switcher"><button class="icon-btn" data-act="dPrev" aria-label="Previous day">' + ic('left') + '</button><strong>' + (isToday ? 'Today, ' + fmtDate(ui.day).slice(5) : fmtDate(ui.day, true)) + '</strong><button class="icon-btn" data-act="dNext" aria-label="Next day">' + ic('right') + '</button></div>';
}
function tiles(s) {
  return '<div class="tiles">' +
    [['Present', s.P, 'good'], ['Late', s.L, 'warn'], ['Half day', s.H, 'half'], ['Absent', s.A, 'bad'], ['On leave', s.V, 'info'], ['Hours worked', fmtDur(s.ms), 'accent']]
      .map(function (t) { return '<div class="tile tone-' + t[2] + '"><b>' + t[1] + '</b><span>' + t[0] + '</span></div>'; }).join('') + '</div>';
}
function calendar(e, ym) {
  var p = ym.split('-').map(Number), first = new Date(p[0], p[1] - 1, 1), n = new Date(p[0], p[1], 0).getDate();
  var off = (first.getDay() + 6) % 7, today = ymd(new Date()), h = '<div class="cal">';
  ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].forEach(function (d) { h += '<div class="dow">' + d.charAt(0) + '</div>'; });
  for (var i = 0; i < off; i++) h += '<div></div>';
  for (var d = 1; d <= n; d++) {
    var ds = ym + '-' + pad(d), st = statusOf(e, ds), filled = ['PRESENT', 'LATE', 'HALF_DAY', 'ABSENT', 'LEAVE', 'HOLIDAY'].indexOf(st) >= 0;
    h += '<div class="day tone-' + (ST[st] || ST.NA).c + (filled ? ' f' : '') + (ds === today ? ' today' : '') + '" title="' + fmtDate(ds) + ': ' + (ST[st] || ST.NA).l + '">' + d + '</div>';
  }
  h += '</div><div class="legend">' + ['PRESENT', 'LATE', 'HALF_DAY', 'ABSENT', 'LEAVE', 'HOLIDAY'].map(function (k) {
    return '<span class="tone-' + ST[k].c + '"><i class="dot"></i>' + ST[k].l + '</span>';
  }).join('') + '</div>';
  return h;
}

/* ----- employee ----- */
function viewToday(e) {
  var ds = ymd(new Date()), r = idx().get(e.id + '|' + ds), st = statusOf(e, ds);
  var canIn = !(r && r.in), canOut = !!(r && r.in && !r.out), s = summary(e, ds.slice(0, 7)), nh = nextHoliday();
  var C = 2 * Math.PI * 104, g = new Date().getHours();
  var greet = g < 12 ? 'Good morning' : g < 17 ? 'Good afternoon' : 'Good evening';
  return head(greet + ', ' + esc(e.name.split(' ')[0]), '<span id="c-date"></span>') +
    '<div class="grid-2"><section class="card"><div class="dial">' + clockHtml() +
      '<div class="ring" id="ring" data-in="' + (r && r.in || '') + '" data-out="' + (r && r.out || '') + '"><svg viewBox="0 0 240 240"><circle class="track" cx="120" cy="120" r="104" fill="none" stroke-width="14"/><circle class="bar" id="ring-bar" cx="120" cy="120" r="104" fill="none" stroke-width="14" stroke-linecap="round" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + C.toFixed(2) + '"/></svg>' +
        '<div class="ring-mid"><b id="worked">0h 00m</b><span class="muted small">worked today</span>' + chip(st) + '</div></div>' +
      '<div class="times"><div class="tile tone-accent"><b class="num">' + (r && r.in ? fmtTime(r.in) : 'Not yet') + '</b><span>Checked in</span></div><div class="tile tone-half"><b class="num">' + (r && r.out ? fmtTime(r.out) : 'Not yet') + '</b><span>Checked out</span></div></div>' +
      '<button class="btn primary punch" data-act="punch"' + (!canIn && !canOut ? ' disabled' : '') + '>' + ic('check') + (canIn ? 'Check in' : canOut ? 'Check out' : 'Done for today') + '</button>' +
      ((st === 'HOLIDAY' || st === 'WEEKOFF') && canIn ? '<p class="small muted">Today is a ' + (st === 'HOLIDAY' ? 'holiday' : 'weekly off') + '. Check in only if you are working.</p>' : '') +
    '</div></section>' +
    '<div class="stack"><section class="card"><div class="spread" style="margin-bottom:14px"><h2 class="sec">This month</h2><span class="muted small">' + MONTHS[new Date().getMonth()] + '</span></div>' + tiles(s) + '</section>' +
      '<section class="card"><h2 class="sec" style="margin-bottom:12px">Your shift</h2><div class="rows">' +
        '<div class="item"><div class="grow"><b>Working hours</b><small>' + db.settings.start + ' to ' + db.settings.end + '</small></div></div>' +
        '<div class="item"><div class="grow"><b>Grace time</b><small>Late after ' + db.settings.grace + ' minutes</small></div></div>' +
        '<div class="item"><div class="grow"><b>Next holiday</b><small>' + (nh ? esc(nh.name) + ', ' + fmtDate(nh.date) : 'None added yet') + '</small></div></div></div></section></div></div>';
}
function viewHistory(e) {
  var s = summary(e, ui.month), today = ymd(new Date()), p = ui.month.split('-').map(Number), n = new Date(p[0], p[1], 0).getDate(), rows = '';
  for (var i = n; i >= 1; i--) {
    var ds = ui.month + '-' + pad(i); if (ds > today) continue;

function tick(first) {

  var el = $('#c-h'); if (el) { el.textContent = pad(h); $('#c-m').textContent = pad(n.getMinutes()); $('#c-s').textContent = ':' + pad(n.getSeconds()); $('#c-a').textContent = n.getHours() < 12 ? 'AM' : 'PM'; }
  var dt = $('#c-date'); if (dt) dt.textContent = D3[n.getDay()] + ', ' + n.getDate() + ' ' + MONTHS[n.getMonth()] + ' ' + n.getFullYear();
  var ring = $('#ring');
  if (ring) {
    var i = Number(ring.dataset.in), o = Number(ring.dataset.out), w = i ? ((o || n.getTime()) - i) : 0;
    var shift = Math.max(60, (at(n, db.settings.end) - at(n, db.settings.start)) / 60000) * 60000;
    var C = 2 * Math.PI * 104, p = Math.min(1, w / shift);
    $('#worked').textContent = fmtDur(w);
    $('#ring-bar').style.opacity = w > 0 ? 1 : 0;
    $('#ring-bar').style.strokeDashoffset = (C * (1 - p)).toFixed(2);
    ring.classList.toggle('done', !!o);
  }
}

  leaveNew: function () {
    modal('Apply for leave', '<div class="chips" id="ltype">' + ['Casual', 'Sick', 'Paid', 'Unpaid'].map(function (t, i) { return '<button class="pick" data-act="leaveType" data-v="' + t + '" aria-pressed="' + (i === 0) + '">' + t + '</button>'; }).join('') + '</div>' +
      '<div class="fields">' + field('l-from', 'From', ymd(new Date()), 'type="date"') + field('l-to', 'To', ymd(new Date()), 'type="date"') + '</div><label class="field"><span>Reason</span><textarea id="l-reason"></textarea></label>' + errP(), footBtns('Send request', 'leaveSave'));
    draft = { type: 'Casual' };
  },
  leaveType: function (d) { draft.type = d.v; document.querySelectorAll('#ltype .pick').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.v === d.v); }); },
  leaveSave: function () {
    var f = v('l-from'), t = v('l-to'), r = v('l-reason').trim();
    if (!f || !t) return showErr('Pick both dates.');
    if (t < f) return showErr('The end date cannot be before the start date.');
    if (!r) return showErr('Add a short reason.');
    db.leaves.push({ id: nid(), emp: me().id, type: draft.type, from: f, to: t, reason: r, status: 'PENDING', at: Date.now() });
    save(); closeModal(); render(); toast('Leave request sent');
  },
  leaveCancel: function (d) { db.leaves = db.leaves.filter(function (l) { return l.id !== Number(d.id); }); save(); render(); toast('Request cancelled'); },
  leaveDecide: function (d) { var l = db.leaves.find(function (x) { return x.id === Number(d.id); }); if (l) { l.status = d.v === 'yes' ? 'APPROVED' : 'REJECTED'; save(); render(); toast(d.v === 'yes' ? 'Leave approved' : 'Leave rejected'); } },
  markOpen: function (d) { markModal(empById(Number(d.id))); },
  markStatus: function (d) {
    draft.status = d.v; document.querySelectorAll('#mstat .pick').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.v === d.v); });
    $('#mtimes').hidden = ['PRESENT', 'LATE', 'HALF_DAY'].indexOf(d.v) < 0;
  },
  markSave: function (d) {
    var id = Number(d.id), ds = ui.day, st = draft.status, times = ['PRESENT', 'LATE', 'HALF_DAY'].indexOf(st) >= 0, day = pd(ds);
    function ms(id2) { var t = v(id2); return t ? at(day, t) : null; }
    var i = times ? ms('m-in') : null, o = times ? ms('m-out') : null;
    if (i && o && o < i) return showErr('Check-out cannot be before check-in.');
    var r = idx().get(id + '|' + ds);
    if (r) { r.status = st; r.in = i; r.out = o; r.note = v('m-note').trim(); } else db.att.push({ id: nid(), emp: id, date: ds, in: i, out: o, status: st, note: v('m-note').trim() });
    save(); closeModal(); render(); toast('Attendance updated');
  },
  markReset: function (d) { var id = Number(d.id); db.att = db.att.filter(function (a) { return !(a.emp === id && a.date === ui.day); }); save(); closeModal(); render(); toast('Reset to automatic'); },
  staffNew: function () { staffModal(null); },
  staffEdit: function (d) { staffModal(empById(Number(d.id))); },
  staffSave: function (d) {
    var id = d.id ? Number(d.id) : 0, name = v('e-name').trim(), code = v('e-code').trim().replace(/\s+/g, ''), pin = v('e-pin').trim();
    if (!name) return showErr('Enter the employee name.');
    if (!code) return showErr('Enter an employee ID.');
    if (!/^\d{4,8}$/.test(pin)) return showErr('The PIN needs 4 to 8 digits.');
    if (db.employees.some(function (x) { return x.id !== id && x.code.toLowerCase() === code.toLowerCase(); })) return showErr('Employee ID ' + code + ' is already used.');
    var data = { code: code, name: name, pin: pin, phone: v('e-phone').trim(), dept: v('e-dept').trim(), role: v('e-role').trim(), join: v('e-join') || ymd(new Date()), active: $('#e-active').checked };
    if (id) Object.assign(empById(id), data); else db.employees.push(Object.assign({ id: nid() }, data));
    save(); closeModal(); render(); toast('Employee saved');
  },
  staffDeleteAsk: function (d) {
    var e = empById(Number(d.id));
    modal('Delete ' + esc(e.name) + '?', '<p>Their attendance and leave records are deleted too. This cannot be undone.</p><p class="muted">To keep the history, switch the employee to inactive instead.</p>',
      '<button class="btn" data-act="closeModal">Keep employee</button><button class="btn danger solid" data-act="staffDelete" data-id="' + e.id + '">Delete</button>');
  },
  staffDelete: function (d) {
    var id = Number(d.id);
    db.employees = db.employees.filter(function (e) { return e.id !== id; }); db.att = db.att.filter(function (a) { return a.emp !== id; }); db.leaves = db.leaves.filter(function (l) { return l.emp !== id; });
    save(); closeModal(); render(); toast('Employee deleted');
  },
  calOpen: function (d) {
    var e = empById(Number(d.id)), p = ui.month.split('-').map(Number);
    modal(esc(e.name) + ', ' + MONTHS[p[1] - 1] + ' ' + p[0], calendar(e, ui.month) + tiles(summary(e, ui.month)), '<button class="btn primary" data-act="closeModal">Close</button>');
  },
  toggleOff: function (d) { var n = Number(d.d), i = db.settings.off.indexOf(n); if (i >= 0) db.settings.off.splice(i, 1); else db.settings.off.push(n); save(); render(); },
  holidayNew: function () { modal('Add holiday', field('h-date', 'Date', ymd(new Date()), 'type="date"') + field('h-name', 'Holiday name', '') + errP(), footBtns('Add holiday', 'holidaySave')); },
  holidaySave: function () {
    var d = v('h-date'), n = v('h-name').trim(); if (!d) return showErr('Pick a date.'); if (!n) return showErr('Enter a name.');
    db.holidays = db.holidays.filter(function (h) { return h.date !== d; }); db.holidays.push({ id: nid(), date: d, name: n });
    save(); closeModal(); render(); toast('Holiday added');
  },
  holidayDel: function (d) { db.holidays = db.holidays.filter(function (h) { return h.id !== Number(d.id); }); save(); render(); },
  csv: function () { exportModal('Report for ' + ui.month, csvFor(ui.month), 'Hazri-attendance-' + ui.month + '.csv', 'text/csv'); },
  backup: function () { exportModal('Back up', JSON.stringify(db), 'hazri-backup.json', 'application/json'); },
  xCopy: function () { var t = $('#x-text'); copyText(t.value, t); },
  xDown: function (d) { download(d.name, (d.mime === 'text/csv' ? '\uFEFF' : '') + $('#x-text').value, d.mime); },
  restoreOpen: function () { modal('Restore', '<p class="muted">Paste a backup here. It replaces everything saved in this browser.</p><textarea class="code" id="r-text" style="min-height:200px"></textarea>' + errP(), footBtns('Restore', 'restoreSave')); },
  restoreSave: function () {
    try {
      var d = JSON.parse(v('r-text'));
      if (!d || !Array.isArray(d.employees) || !Array.isArray(d.att)) throw 0;
      db = Object.assign(defaults(), d); db.settings = Object.assign(defaults().settings, d.settings || {});
      save(); closeModal(); render(); toast('Backup restored');
    } catch (e) { showErr('That text is not a Hazri backup.'); }
  },
  freshAsk: function () { modal('Remove sample data?', '<p>This deletes the sample employees, attendance and leave requests so you can start with your own. Your admin PIN stays the same.</p>', '<button class="btn" data-act="closeModal">Keep sample data</button><button class="btn danger solid" data-act="fresh">Remove sample data</button>'); },
  fresh: function () { var pin = db.settings.adminPin, th = db.settings.theme; db = defaults(); db.settings.adminPin = pin; db.settings.theme = th; save(); closeModal(); ui.tab = 'dash'; render(); toast('Sample data removed. Add your first employee.'); }
};

document.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-act]'); if (!t) return;
  var fn = actions[t.dataset.act]; if (fn) { ev.preventDefault(); fn(t.dataset); }
});
document.addEventListener('submit', function (ev) { if (ev.target.id === 'loginForm') { ev.preventDefault(); doLogin(); } });
document.addEventListener('input', function (ev) {
  if (ev.target.id === 'staffQ') { ui.staffQ = ev.target.value; $('#staffList').innerHTML = staffRows(); }
});
document.addEventListener('change', function (ev) {
  var k = ev.target.dataset && ev.target.dataset.set; if (!k) return;
  var val = ev.target.value;
  if (k === 'grace') val = Math.max(0, Math.min(120, parseInt(val, 10) || 0));
  if (k === 'halfHrs') val = Math.max(1, Math.min(12, parseInt(val, 10) || 4));
  if ((k === 'start' || k === 'end') && !val) return;
  if (k === 'company' && !val.trim()) val = 'Your Company';
  db.settings[k] = val; save(); toast('Saved');
});
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !$('#modal').hidden) closeModal(); });

render();
})();
</script>
</body>
</html>
